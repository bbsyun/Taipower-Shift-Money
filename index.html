<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="加班查詢">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>加班時數查詢</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#222;--sub:#6b7280;--line:#e5e7eb;--blue:#337ab0;--blue2:#e6f0f8;--hl:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--card:#1c2026;--ink:#eceff3;--sub:#9aa3af;--line:#2d333b;--blue:#5aa3d6;--blue2:#1d2d3a;--hl:#ff7b6b}}
:root[data-theme="dark"]{--bg:#121417;--card:#1c2026;--ink:#eceff3;--sub:#9aa3af;--line:#2d333b;--blue:#5aa3d6;--blue2:#1d2d3a;--hl:#ff7b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px}
header{background:var(--blue);color:#fff;padding:12px 18px;font-size:19px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:12px}
header .lg{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:#fff;padding:3px;display:block}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.row b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sel{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.sel label{font-size:14px;color:var(--sub)}
select{flex:1;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;font:inherit;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.big{font-size:44px;font-weight:700;line-height:1.1;color:var(--blue);font-variant-numeric:tabular-nums}
.big span{font-size:16px;font-weight:400;color:var(--sub);margin-left:6px}
h2{font-size:16px;margin:0 0 8px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:10px 0 6px}
.bar i{display:block;height:100%}
.leg{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.leg b{color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--sub);line-height:1.6}
.hl{color:var(--hl)}

.yr{display:flex;gap:8px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:500}
tr.on td{background:var(--blue2)}
tbody tr{cursor:pointer}
.tag{font-size:11.5px;border:1px solid var(--sub);color:var(--sub);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:middle}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.wd{color:var(--sub);padding-bottom:2px}
.cd{border-radius:8px;padding:4px 0;background:var(--bg)}
.cd i{display:block;font-style:normal;color:var(--sub);font-size:11px}
.cd b{font-size:13px;font-weight:600}
.cd.n1{background:rgba(192,57,43,.18)}.cd.n2{background:rgba(51,122,176,.22)}.cd.n3{background:rgba(224,160,48,.25)}
.cd.hh{outline:1px solid var(--hl)}.cd.hh i{color:var(--hl);font-weight:700}
.cp{font-size:12px;color:var(--sub);text-align:center;margin-bottom:10px;letter-spacing:.03em}
</style>
</head>

<script>
var CL={A:{n:"新複值 A 班",o:3},B:{n:"新複值 B 班",o:0},C:{n:"新複值 C 班",o:9},D:{n:"新複值 D 班",o:6}},cur="B";
var CY=["二1","二2","二3","一1","一2","一3","大空","大空","三1","三2","三3","小空"];
var GH=[8.5,8.5,7,9.5,9.5,9.5,0,0,9,7.5,7.5,0],DAY=864e5;
function U(y,m,d){return Date.UTC(y,m-1,d)}
function wk(t){return new Date(t).getUTCDay()}
function off(t){var w=wk(t);return w==0||w==6}
var H={},SP={};
function add(t,n,k){if(!H[t])H[t]={n:n,t:k}}
var LNY={2027:[2,6],2028:[1,26],2029:[2,13],2030:[2,3]},QM={2026:5,2027:5,2028:4,2029:4,2030:5};
var DW={2026:[6,19],2027:[6,9],2028:[5,28],2029:[6,16],2030:[6,5]},MA={2026:[9,25],2027:[9,15],2028:[10,3],2029:[9,22],2030:[9,12]};
[2026,2027,2028,2029,2030].forEach(function(y){
  var q=QM[y],b=[[U(y,1,1),"開國紀念日"],[U(y,2,28),"和平紀念日"],[U(y,4,q==4?3:4),"兒童節"],[U(y,4,q),"清明節"],[U(y,5,1),"勞動節"],
  [U(y,DW[y][0],DW[y][1]),"端午節"],[U(y,MA[y][0],MA[y][1]),"中秋節"],[U(y,9,28),"教師節"],[U(y,10,10),"國慶日"],[U(y,10,25),"光復節"],[U(y,12,25),"行憲紀念日"]];
  b.forEach(function(x){add(x[0],x[1],"國假")});
  SP[U(y,1,1)]={h:4,k:"ny"};
  if(LNY[y]){var t0=U(y,LNY[y][0],LNY[y][1]),nm=["小年夜","除夕","春節初一","春節初二","春節初三","春節初四","春節初五"];
    for(var i=-2;i<=4;i++){add(t0+i*DAY,nm[i+2],(i==-2||i==4)?"補假":"國假");if(i<=2)SP[t0+i*DAY]={h:8,k:"sp"}}}
  b.sort(function(a,c){return a[0]-c[0]});
  b.forEach(function(x){var w=wk(x[0]),t;
    if(w==6){t=x[0]-DAY;while(H[t]||off(t))t-=DAY;add(t,x[1]+"補假","補假")}
    else if(w==0){t=x[0]+DAY;while(H[t]||off(t))t+=DAY;add(t,x[1]+"補假","補假")}});
});
function calc(y,m){
  var n=new Date(Date.UTC(y,m,0)).getUTCDate(),G=0,N=0,C=0,hb=0,ext=0,n3=0,n1=0,ex=[],ev=[],ds=[];
  for(var d=1;d<=n;d++){
    var t=U(y,m,d),si=((Math.round((t-U(2026,9,1))/DAY)+CL[cur].o)%12+12)%12,g=GH[si],h=H[t],w=wk(t);
    if(w>0&&w<6&&!h)C+=8;
    ds.push({d:d,w:w,s:CY[si],h:h?h.t:""});
    if(!g)continue;
    N++;G+=g;var net=g-.5;
    if(si>=8&&si<=10)n3++;if(si>=3&&si<=5)n1++;
    var rec=0,add2=0,txt="";
    if(h&&h.t=="國假"){rec=Math.min(net,8);hb+=rec}
    var sp=SP[t];
    if(sp&&(sp.k=="sp"||si<3)){add2=sp.h;ext+=add2;
      if(si<3)ex.push([sp.k=="ny"?"元旦午晚餐費":"春節午晚餐費",150]);
      else if(si<6&&sp.k=="sp")ex.push(["春節下班早餐費",75])}
    if(h||add2)ev.push({d:m+"/"+d,n:h?h.n:(sp.k=="ny"?"元旦":""),k:h?h.t:"",s:CY[si],net:net,rec:rec,add:add2});
  }
  var A=G-.5*N,B=.5*N,tot=G-C,rest=tot-hb,f=Math.floor(rest/12),r=rest-f*12;
  var s=[f*2+Math.min(r,2),f*6+Math.min(Math.max(r-2,0),6),f*4+Math.max(r-8,0)];
  var meal=n3*250+n1*400,mx={};
  ex.forEach(function(e){meal+=e[1];mx[e[0]]=mx[e[0]]||[0,0];mx[e[0]][0]++;mx[e[0]][1]+=e[1]});
  return{A:A,B:B,C:C,tot:tot,hb:hb,ext:ext,hol:hb+ext,rest:rest,s:s,n3:n3,n1:n1,mx:mx,meal:meal,ev:ev,ds:ds};
}

   +row("國定假日時數",d.ext?"出勤 "+F(d.hb)+" + 額外給予 "+F(d.ext):"單日上限 8 小時",F(d.hol)+" 時",d.hol?"hl":"")
   +row("進 12 切時數","(A)+(B)−(C) 扣國假出勤",F(d.rest)+" 時");
  $("ev").innerHTML=d.ev.length?d.ev.map(function(e){return row(e.d+" "+(e.n||"")+(e.k=="補假"?"":""),e.s+"(扣交接班後 "+F(e.net)+" 時)"+(e.k=="補假"?",補假不計國假,全部進 12 切":""),e.rec||e.add?"國假 "+F(e.rec+e.add):"進 12 切")}).join(""):'<div class="note">本月沒有假日出勤。</div>';
  var bar="",leg="";d.s.forEach(function(v,j){bar+='<i style="width:'+(d.rest?v/d.rest*100:0)+'%;background:'+COL[j]+'"></i>';leg+='<span>'+NAME[j]+' <b>'+F(v)+'</b></span>'});
  $("bar").innerHTML=bar;$("leg").innerHTML=leg;
  var ml=row("初夜點 × "+d.n3+" 次","每次 250 元",d.n3*250+" 元")+row("深夜點 × "+d.n1+" 次","每次 400 元",d.n1*400+" 元");
  for(var k in d.mx)ml+=row(k+" × "+d.mx[k][0]+" 次","",d.mx[k][1]+" 元");
  $("meal").innerHTML=ml+row("合計","",d.meal.toLocaleString()+" 元","hl");
  $("ovT").textContent=(y-1911)+" 年各月總覽";
  var o="";for(i=(y==2026?9:1);i<=12;i++){var c=calc(y,i);o+='<tr data-m="'+i+'"'+(i==m?' class="on"':'')+'><td>'+i+'月</td><td>'+F(c.tot)+'</td><td>'+F(c.hol)+'</td><td>'+F(c.rest)+'</td><td>'+c.meal.toLocaleString()+'</td></tr>'}
  $("ov").innerHTML=o;
  document.querySelectorAll("#ov tr").forEach(function(r){r.onclick=function(){show(y,+r.dataset.m);window.scrollTo(0,0)}});
}
var sl=$("cls");
for(var k in CL){var op=document.createElement("option");op.value=k;op.textContent=CL[k].n+(CL[k].o===null?"(待提供班表)":"");op.disabled=CL[k].o===null;sl.appendChild(op)}
sl.value=cur;sl.onchange=function(){cur=sl.value;show(Y,M)};
show(2026,10);
</script>
